<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>EPGP Attendance</title>
  <link href="https://unpkg.com/gridjs/dist/theme/mermaid.min.css" rel="stylesheet" />
  <script src="https://unpkg.com/gridjs/dist/gridjs.umd.js"></script>
  <style>
    body { font-family: sans-serif; }
    #tableWrapper { overflow-x: auto; }

    /* Raid header cells (5th column onward): tall, narrow, bottom-aligned */
    #tableWrapper .gridjs-thead th.gridjs-th:nth-child(n+5) {
      height: 160px;
      vertical-align: bottom;
      overflow: visible;
      padding: 0 2px 4px 2px;
    }

    /* Rotate raid header text 90° (reads bottom-to-top) */
    #tableWrapper .gridjs-thead th.gridjs-th:nth-child(n+5) .gridjs-th-content {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      white-space: nowrap;
      text-align: left;
    }

    /* Center percentage values in computed + raid data cells */
    #tableWrapper .gridjs-tbody td.gridjs-td:nth-child(n+2) {
      text-align: center;
    }
  </style>
</head>
<body>
  <a href="../">← Back to standings</a>
  <h1>Raidteilnahme</h1>

  <div style="margin: 0 0 12px 0;">
    Letzte Änderung: <span id="lastModified">–</span>
  </div>

  <div id="tableWrapper"></div>

  <script>
    function fmtLastModified(s) {
      if (!s) return '–';
      const d = new Date(s);
      if (isNaN(d)) return s;
      return d.toLocaleString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    const fmtPct = (val) => {
      if (val === null || val === undefined) return '???';
      if (val === 0) return '---';
      return Math.round(val) + '%';
    };

    const sortNum = (a, b) => {
      const sa = (a === null || a === undefined) ? -1 : a;
      const sb = (b === null || b === undefined) ? -1 : b;
      return sa - sb;
    };

    fetch('attendance.json')
      .then(r => r.json())
      .then(data => {
        document.getElementById('lastModified').textContent = fmtLastModified(data.lastModified);

        const raids = data.raids ?? [];
        const players = data.players ?? [];

        const raidColumns = raids.map(r => ({
          name: r.totalMinutes !== null ? `${r.name} · ${r.totalMinutes} min` : r.name,
          width: '52px',
          sort: { compare: sortNum },
          formatter: (cell) => fmtPct(cell)
        }));

        const columns = [
          { name: 'Player', sort: true },
          {
            name: 'Overall',
            sort: { compare: sortNum },
            formatter: (cell) => fmtPct(cell)
          },
          {
            name: 'Weighted',
            sort: { compare: sortNum },
            formatter: (cell) => fmtPct(cell)
          },
          {
            name: 'Member Since',
            sort: { compare: sortNum },
            formatter: (cell) => fmtPct(cell)
          },
          ...raidColumns
        ];

        const tableData = players.map(p => [
          p.name ?? '',
          p.overallPct ?? null,
          p.decayedPct ?? null,
          p.memberSincePct ?? null,
          ...(p.raids ?? []).map(v => (v === undefined ? null : v))
        ]);

        new gridjs.Grid({
          columns,
          data: tableData,
          sort: true
        }).render(document.getElementById('tableWrapper'));
      });
  </script>
</body>
</html>
