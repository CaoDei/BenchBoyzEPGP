<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>EPGP Attendance</title>
  <link href="https://unpkg.com/gridjs/dist/theme/mermaid.min.css" rel="stylesheet" />
  <script src="https://unpkg.com/gridjs/dist/gridjs.umd.js"></script>
  <style>
    body { font-family: sans-serif; }

    /* Horizontal scroll for the wide raid matrix.
       gridjs caps the table at width:100% (table-layout:fixed) and the
       container has overflow:hidden, so extra columns get squeezed/clipped
       with no scrollbar. Let the table grow to its natural width and make
       #tableWrapper the single horizontal scroll container. */
    #tableWrapper { overflow-x: auto; }
    #tableWrapper .gridjs-container { display: block; overflow: visible; }
    #tableWrapper .gridjs-wrapper { overflow: visible; }
    #tableWrapper table.gridjs-table { width: max-content !important; max-width: none !important; }

    /* Move the horizontal scrollbar to the TOP of the table: flip the scroll
       container vertically, then flip its child back so content reads normally. */
    #tableWrapper { transform: rotateX(180deg); }
    #tableWrapper > * { transform: rotateX(180deg); }

    /* Header cells from the 2nd column onward (averages + raids):
       tall, narrow, bottom-aligned with vertical text. */
    #tableWrapper .gridjs-thead th.gridjs-th:nth-child(n+2) {
      height: 160px;
      vertical-align: bottom;
      overflow: visible;
      padding: 0 2px 4px 2px;
    }

    /* Rotate header text 90° (reads bottom-to-top) */
    #tableWrapper .gridjs-thead th.gridjs-th:nth-child(n+2) .gridjs-th-content {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      white-space: nowrap;
      text-align: left;
    }

    /* Center values in computed + raid data cells (no wrapping on short markers),
       with reduced horizontal padding so the narrowed columns stay tight. */
    #tableWrapper .gridjs-tbody td.gridjs-td:nth-child(n+2) {
      text-align: center !important;
      vertical-align: middle;
      white-space: nowrap;
      padding-left: 5px;
      padding-right: 5px;
    }
  </style>
</head>
<body>
  <a href="../">← Back to standings</a>
  <h1>Raidteilnahme</h1>

  <div style="margin: 0 0 12px 0;">
    Letzte Änderung: <span id="lastModified">–</span>
  </div>

  <div id="tableWrapper"></div>

  <script>
    function fmtLastModified(s) {
      if (!s) return '–';
      const d = new Date(s);
      if (isNaN(d)) return s;
      return d.toLocaleString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    const fmtPct = (val) => {
      if (val === null || val === undefined) return '???';
      if (val === 0) return '–';
      return Math.round(val) + '%';
    };

    const sortNum = (a, b) => {
      const sa = (a === null || a === undefined) ? -1 : a;
      const sb = (b === null || b === undefined) ? -1 : b;
      return sa - sb;
    };

    fetch('attendance.json')
      .then(r => r.json())
      .then(data => {
        document.getElementById('lastModified').textContent = fmtLastModified(data.attendanceLastModified ?? data.lastModified);

        const raids = data.raids ?? [];
        const players = data.players ?? [];

        // Narrowed data-column width (~40% off the previous ~76px). autoWidth:false
        // (below) makes gridjs honor these widths exactly instead of auto-expanding.
        const dataWidth = '46px';

        const raidColumns = raids.map(r => ({
          name: r.totalMinutes !== null ? `${r.name} · ${r.totalMinutes} min` : r.name,
          width: dataWidth,
          sort: { compare: sortNum },
          formatter: (cell) => fmtPct(cell)
        }));

        const columns = [
          { name: 'Player', width: '160px', sort: true },
          {
            name: 'Overall',
            width: dataWidth,
            sort: { compare: sortNum },
            formatter: (cell) => fmtPct(cell)
          },
          {
            name: 'Weighted',
            width: dataWidth,
            sort: { compare: sortNum },
            formatter: (cell) => fmtPct(cell)
          },
          {
            name: 'Weighted since member',
            width: dataWidth,
            sort: { compare: sortNum },
            formatter: (cell) => fmtPct(cell)
          },
          ...raidColumns
        ];

        const tableData = players.map(p => [
          p.name ?? '',
          p.overallPct ?? null,
          p.decayedPct ?? null,
          p.memberSincePct ?? null,
          ...(p.raids ?? []).map(v => (v === undefined ? null : v))
        ]);

        new gridjs.Grid({
          columns,
          data: tableData,
          sort: true,
          autoWidth: false
        }).render(document.getElementById('tableWrapper'));
      });
  </script>
</body>
</html>
