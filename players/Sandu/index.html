<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>EPGP Ledger</title>
  <link href="https://unpkg.com/gridjs/dist/theme/mermaid.min.css" rel="stylesheet" />
  <script src="https://unpkg.com/gridjs/dist/gridjs.umd.js"></script>
</head>
<body>
  <a href="../../">← Back to standings</a>
  <h1 id="title">EPGP Ledger</h1>

  <div style="margin: 0 0 12px 0; font-family: sans-serif;">
    Letzte Änderung: <span id="lastModified">–</span>
  </div>

  <div id="summary" style="margin: 0 0 18px 0; font-family: sans-serif;"></div>

  <h2>EP Ledger</h2>
  <div id="epTable"></div>

  <h2>GP-M Ledger</h2>
  <div id="gpmTable"></div>

  <h2>GP-A Ledger</h2>
  <div id="gpaTable"></div>

  <script>
    const fmtDt = (iso) => {
      if (!iso) return "";
      const d = new Date(iso);
      return new Intl.DateTimeFormat("de-DE", {
        dateStyle: "medium",
        timeStyle: "short",
        timeZone: "Europe/Berlin"
      }).format(d);
    };

    const fmtDelta = (n) => {
      const x = Number(n) || 0;
      return (x > 0 ? "+" : "") + x.toString();
    };

    function renderLedger(targetId, rows) {
      new gridjs.Grid({
        columns: [
          { name: "Datum", sort: true },
          { name: "Δ", sort: true },
          { name: "Beschreibung", sort: true }
        ],
        data: (rows ?? []).map(e => [fmtDt(e.ts), fmtDelta(e.delta), e.desc ?? ""])
      }).render(document.getElementById(targetId));
    }

    fetch("ledger.json")
      .then(r => r.json())
      .then(p => {
        document.getElementById("title").textContent = `${p.player} (Main: ${p.main})`;
        document.getElementById("lastModified").textContent = fmtDt(p.lastModified);

        const s = p.saldo || {};
        document.getElementById("summary").textContent =
          `Saldo — EP: ${s.ep ?? 0} | GP-M: ${s.gp_m ?? 0} | PR-M: ${s.pr_m ?? 0} | GP-A: ${s.gp_a ?? 0} | PR-A: ${s.pr_a ?? 0}`;

        renderLedger("epTable",  p.ledger?.ep);
        renderLedger("gpmTable", p.ledger?.gp_m);
        renderLedger("gpaTable", p.ledger?.gp_a);
      });
  </script>
</body>
</html>
