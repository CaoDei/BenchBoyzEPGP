<script>
  function playerUrl(playerName) {
    // folder per player; encode for spaces/umlauts
    return `players/${encodeURIComponent(playerName)}/`;
  }

  fetch('standings.json')
    .then(r => r.json())
    .then(payload => {
      document.getElementById('lastModified').textContent =
        payload.lastModified ?? '–';

      const rows = payload.rows ?? [];

      new gridjs.Grid({
        columns: [
          {
            name: 'Player',
            sort: true,
            formatter: (cell) => gridjs.html(
              `<a href="${playerUrl(cell)}">${cell}</a>`
            )
          },
          { name: 'Main', sort: true },
          { name: 'Class', sort: true },
          { name: 'EP', sort: true },
          { name: 'GP-M', sort: true },
          { name: 'PR-M', sort: true },
          { name: 'GP-A', sort: true },
          { name: 'PR-A', sort: true }
        ],
        data: rows.map(p => [
          p.player ?? '',
          p.main ?? '',
          p.class ?? '',
          p.ep ?? 0,
          p.gp_m ?? 0,
          p.pr_m ?? 0,
          p.gp_a ?? 0,
          p.pr_a ?? 0
        ])
      }).render(document.getElementById('table'));
    });
</script>
