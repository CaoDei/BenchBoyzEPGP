<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>EPGP Standings</title>
  <link href="https://unpkg.com/gridjs/dist/theme/mermaid.min.css" rel="stylesheet" />
  <script src="https://unpkg.com/gridjs/dist/gridjs.umd.js"></script>
  <style>
    body { font-family: sans-serif; }
  </style>
</head>
<body>
  <h1>BenchBoyz EPGP</h1>

  <div id="meta" style="margin: 0 0 12px 0;">
    Letzte Änderung: <span id="lastModified">–</span>
  </div>

  <div style="margin: 0 0 12px 0;">
    <a href="attendance/">Raidteilnahme</a>
  </div>

  <div id="table"></div>

  <script>
    function fmtLastModified(s) {
      if (!s) return '–';
      const parts = s.split(' ');
      if (parts.length < 2) return s;
      const d = parts[0].split('-');
      if (d.length !== 3) return s;
      return `${d[2]}.${d[1]}.${d[0]} ${parts[1]}`;
    }

    function playerUrl(playerName) {
        // folder per player; encode for spaces/umlauts
        return `players/${encodeURIComponent(playerName)}/`;
    }

    fetch('standings.json')
        .then(r => r.json())
        .then(payload => {
        document.getElementById('lastModified').textContent =
            fmtLastModified(payload.lastModified);

        const rows = payload.rows ?? [];

        new gridjs.Grid({
            columns: [
            {
                name: 'Player',
                sort: true,
                formatter: (cell) => gridjs.html(
                `<a href="${playerUrl(cell)}">${cell}</a>`
                )
            },
            { name: 'Main', sort: true },
            { name: 'Class', sort: true },
            { name: 'EP', sort: true },
            { name: 'GP-M', sort: true },
            { name: 'PR-M', sort: true },
            { name: 'GP-A', sort: true },
            { name: 'PR-A', sort: true }
            ],
            data: rows.map(p => [
            p.player ?? '',
            p.main ?? '',
            p.class ?? '',
            p.ep ?? 0,
            p.gp_m ?? 0,
            p.pr_m ?? 0,
            p.gp_a ?? 0,
            p.pr_a ?? 0
            ])
        }).render(document.getElementById('table'));
        });
    </script>
</body>
</html>
