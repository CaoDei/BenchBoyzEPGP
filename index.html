<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>EPGP Standings</title>
  <link href="https://unpkg.com/gridjs/dist/theme/mermaid.min.css" rel="stylesheet" />
  <script src="https://unpkg.com/gridjs/dist/gridjs.umd.js"></script>
</head>
<body>
  <h1>Guild EPGP Standings</h1>
  <div id="table"></div>

  <script>
    fetch('standings.json')
      .then(r => r.json())
      .then(data => {
        new gridjs.Grid({
          columns: [
            { name: 'Player', sort: true },
            { name: 'EP', sort: true },
            { name: 'GP', sort: true },
            { name: 'PR', sort: true }
          ],
          data: data.map(p => [p.player, p.ep, p.gp, p.pr])
        }).render(document.getElementById('table'));
      });
  </script>
</body>
</html>
